[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ensec-cli"
version = "3.0.0"
description = "EncryptSecureDEC Open Source CLI"
requires-python = ">=3.9"
readme = "README.md"
authors = [
    { name = "Anvelk Innovations LLC." }
]

maintainers = [
    { name = "Anvelk Innovations LLC." }
]
dependencies = [
    "pycryptodome",
    "cryptography",
    "reedsolo"
]
[tool.setuptools]
packages = ["ensec_cli"]

[project.scripts]
ensec = "ensec_cli.cli:main"